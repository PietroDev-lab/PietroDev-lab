name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # =========================
      # 1. Generate GitHub Trophy
      # =========================
      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: false

      # =========================
      # 2. Generate Pac-Man Arcade
      # =========================
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # =========================
      # 3. Generate Cute Snake Game
      # =========================
      - name: Generate Cute Snake contribution animation
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=white&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # =========================
      # Normalize file names for compatibility
      # =========================
      - name: Prepare and verify dist assets
        run: |
          if [ -f "dist/pacman-dark.svg" ]; then
            cp dist/pacman-dark.svg dist/pacman-contribution-graph-dark.svg
            cp dist/pacman.svg dist/pacman-contribution-graph.svg 2>/dev/null || true
          fi
          ls -la dist/

      # =========================
      # Deploy to output branches
      # =========================
      - name: Push all assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        continue-on-error: true
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to trophy-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        continue-on-error: true
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}